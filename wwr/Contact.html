<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Learn more about Exciting Expeditions, a whitewater rafting company offering thrilling, guided river adventures for all skill levels.">
    <meta name="author" content="Emmanuel Koweh Musa">
    <title>About Us - Exciting Expeditions</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <div>
            <img src="images/raftinglogo.webp" alt="Exciting Expeditions logo" class="logo">
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="trips.html">Trips</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="contact-info">
            <h1>White Water Rafting Company</h1>
            <address>
                123 Main River Street<br>
                Kolob, California<br>
                <a href="tel:+19999999999">+1 999 999 9999</a><br>
                <a href="mailto:info@whitewater.com">info@whitewater.com</a>
            </address>
        </div>

        <div class="contact-layout">
            <iframe src="https://www.google.com/maps?q=Kolob,+California&amp;output=embed"
              title="Map showing the Exciting Expeditions location" loading="lazy" allowfullscreen
              referrerpolicy="no-referrer-when-downgrade"></iframe>

            <form action="#" method="post" class="contact-form">
                <div>
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your full name" required>
                </div>

                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com"
                      required>
                </div>

                <fieldset>
                    <legend>Message Purpose</legend>
                    <label class="choice" for="general">
                        <input type="radio" id="general" name="purpose" value="general" checked>
                        General Inquiry
                    </label>
                    <label class="choice" for="reservation">
                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        Reservation Question
                    </label>
                    <label class="choice" for="suggestion">
                        <input type="radio" id="suggestion" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <div>
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4" placeholder="Type here"
                      required></textarea>
                </div>

                <label class="choice" for="newsletter">
                    <input type="checkbox" id="newsletter" name="newsletter" value="yes">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit">Get in Touch!</button>
            </form>
        </div>

        <section class="staff">
            <h2>We Are Here to Serve You</h2>
            <div class="staff-grid">
                <figure>
                    <img src="images/employee1.webp" alt="Portrait of our lead river guide">
                    <figcaption>Lead River Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.webp" alt="Portrait of our operations manager">
                    <figcaption>Operations Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.webp" alt="Portrait of our customer service lead">
                    <figcaption>Customer Service Lead</figcaption>
                </figure>
            </div>
        </section>
    </main>


    <footer>
        <p>&copy; 2026 Exciting Expeditions | Emmanuel Koweh Musa</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.svg" alt="Facebook"></a>
            <a href="https://linkedin.com"><img src="images/linkedin.svg" alt="LinkedIn"></a>
            <a href="https://instagram.com"><img src="images/instagram.svg" alt="Instagram"></a>
        </nav>
    </footer>
</body>

</html>
