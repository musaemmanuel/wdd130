<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Quiz Form</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <main>
        <h1>Basic HTML and CSS Quiz</h1>
        <form>
            <div class="quiz-item box">
                <label for="q1">1. What does the acronym HTML stand for?</label>
                <input type="text" id="q1" name="q1">
            </div>
            <div class="quiz-item box">
                <label for="q2">2. Which tag is used to create a hyperlink?</label>
                <textarea id="q2" name="q2"></textarea>
            </div>
            <div class="quiz-item box">
                <label for="q3">3. Which of the following is a valid HTML comment?</label>
                <select id="q3" name="q3">
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="a">i. // This is a comment</option>
                    <option value="b">ii. /* This is a comment */</option>
                    <option value="c">iii. &lt;!-- This is a comment --&gt;</option>
                </select>
            </div>
            <div class="quiz-item box">
                <label for="q4">4. What is the maximum value allowed by this input?</label>
                <code>&lt;input type="number" min="1" max="40"&gt;</code>
                <input type="number" id="q2" name="q2">
            </div>
            <button type="submit box">Submit Quiz for Grading</button>
        </form>
    </main>

</body>

</html>
